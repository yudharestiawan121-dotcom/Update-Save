<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b38"><title>TokoPro — Sistem Toko</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#101b38;--blue:#2459df;--bg:#f3f6fb;--ink:#17213b;--muted:#71809a;--line:#e3e9f3;--green:#168b55;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e9eef8;color:#233b70}button.danger{background:#b93838}button:disabled{opacity:.5}
input,select{width:100%;padding:10px;border:1px solid #d5deeb;border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;font-weight:650;margin:10px 0 5px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}
header{height:64px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}
.brand{font-size:18px;font-weight:850;letter-spacing:.3px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}aside .who{padding:10px 12px;margin-bottom:14px;background:#f3f6fc;border-radius:10px}
nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:#34415c;font-weight:600}nav button.active,nav button:hover{background:#eaf0ff;color:#2049b4}
main{padding:24px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 4px 15px #1b315008}.metric{font-size:25px;font-weight:850;margin-top:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#65728a;background:#f8faff}
.tablewrap{overflow:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:300px}
.badge{display:inline-block;border-radius:99px;padding:4px 8px;background:#edf2ff;color:#2447a0;font-size:11px;font-weight:750}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;padding:26px;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #17213b12}
.loginbox h1{margin-bottom:6px}.notice{padding:10px;background:#fff7df;border:1px solid #f0dfa0;border-radius:9px;margin:12px 0;font-size:12px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.right{text-align:right}.total{font-size:24px;font-weight:850}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;bottom:18px;right:18px;background:#17213b;color:#fff;padding:12px 16px;border-radius:10px;display:none;max-width:90vw;z-index:9}
@media(max-width:850px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,1fr)}main{padding:15px}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}header{padding:0 14px}}
</style></head>
<body>
<div id="loginView" class="login">
 <div class="loginbox"><div class="brand">▣ TOKOPRO</div><p class="muted">Sistem operasional toko</p>
  <label>Email pengguna</label><input id="email" type="email" placeholder="nama@toko.com">
  <label>Password</label><input id="password" type="password" placeholder="Password">
  <button id="loginBtn" style="width:100%;margin-top:16px">Masuk</button>
  <p class="small muted">Akun dibuat oleh MASTER melalui Supabase Authentication.</p>
  <div class="notice">Isi konfigurasi Supabase di file <b>app.js</b> sebelum digunakan.</div>
 </div>
</div>
<div id="appView" class="hidden">
<header><div class="brand" id="storeBrand">▣ TOKOPRO</div><div class="actions"><span id="userLabel" class="small"></span><button id="logoutBtn" class="secondary">Keluar</button></div></header>
<div class="shell"><aside><div class="who"><b id="roleLabel">Pengguna</b><div class="small muted" id="emailLabel"></div></div><nav id="nav"></nav></aside><main><div class="pagehead"><div><h1 id="pageTitle">Ringkasan</h1><div class="small muted" id="pageSub">Informasi operasional toko</div></div></div><div id="content"></div></main></div>
</div><div id="toast"></div>
<script src="app.js"></script>
</body></html>
